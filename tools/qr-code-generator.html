<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — Free Online QR Maker</title>
<meta name="description" content="Free QR code generator. Turn any URL or text into a downloadable QR code instantly. No watermark, no signup.">
<link rel="canonical" href="https://haowordtool.com/tools/qr-code-generator.html">
<link rel="alternate" hreflang="en" href="https://haowordtool.com/tools/qr-code-generator.html">
<link rel="alternate" hreflang="de" href="https://haowordtool.com/de/tools/qr-code-generator.html">
<link rel="alternate" hreflang="ja" href="https://haowordtool.com/ja/tools/qr-code-generator.html">
<link rel="alternate" hreflang="es" href="https://haowordtool.com/es/tools/generador-qr.html">
<link rel="alternate" hreflang="ar" href="https://haowordtool.com/ar/tools/mawlid-ramz-qr.html">
<link rel="alternate" hreflang="ru" href="https://haowordtool.com/ru/tools/generator-qr.html">
<link rel="alternate" hreflang="x-default" href="https://haowordtool.com/tools/qr-code-generator.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tools.css">
</head>
<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<header id="header"><div class="wrap"><nav class="nav">
  <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>Haowordtool Tools</a>
  <div class="nav-right"><div class="lang-switch"><a href="/tools/qr-code-generator.html" class="active" hreflang="en">EN</a></div></div>
</nav></div></header>

<main><div class="wrap tool-page">
  <a href="index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">QR Code Generator</h1>
  <p class="lead">Turn any URL or text into a QR code. Download as PNG instantly.</p>

  <div class="card" style="max-width:640px">
    <label for="text">URL or text</label>
    <textarea id="text" style="min-height:100px">https://haowordtool.com</textarea>

    <div style="margin-top:16px">
      <label>Size: <span id="sv">256</span>px</label>
      <input type="range" id="size" min="128" max="512" step="32" value="256">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="go">Generate</button>
      <a class="btn btn-ghost" id="dl" style="display:none" download="qrcode.png">Download</a>
    </div>

    <div id="out" style="display:none;margin-top:20px;text-align:center">
      <div style="display:inline-block;padding:20px;background:#fff;border-radius:14px">
        <canvas id="canvas" style="display:block"></canvas>
      </div>
    </div>
  </div>
</div>
<div class="related-tools">
  <h2 id="relatedTitle">Related Tools</h2>
  <div class="related-grid" id="relatedGrid"></div>
</div>
</main>

<footer><div class="wrap"><div class="foot">
  <span>© 2026 Haowordtool Tools · Free forever</span>
  <div class="foot-links"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a></div>
</div></div></footer>

<script>
const canvas = document.getElementById("canvas");
const size = document.getElementById("size");
const sv = document.getElementById("sv");
size.oninput = () => sv.textContent = size.value;

document.getElementById("go").onclick = () => {
  const text = document.getElementById("text").value.trim();
  if (!text) return;
  const s = parseInt(size.value);
  canvas.width = s; canvas.height = s;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    canvas.getContext("2d").drawImage(img, 0, 0, s, s);
    document.getElementById("out").style.display = "block";
    document.getElementById("dl").style.display = "inline-flex";
  };
  img.src = "https://api.qrserver.com/v1/create-qr-code/?size=" + s + "x" + s + "&data=" + encodeURIComponent(text);
  document.getElementById("dl").href = img.src;
};
document.getElementById("go").click();

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>

<script type="application/json" id="relatedData">["image-compressor","password-generator","resize-image"]</script>
<script src="/assets/related-tools.js" defer></script>
</body>
</html>
