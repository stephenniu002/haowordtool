<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — Length, Weight, Temperature</title>
<meta name="description" content="Free online unit converter. Convert length, weight, and temperature instantly. Meters, feet, kilograms, pounds, Celsius, Fahrenheit and more.">
<link rel="canonical" href="https://haowordtool.com/tools/unit-converter.html">

<link rel="alternate" hreflang="en" href="https://haowordtool.com/tools/unit-converter.html">
<link rel="alternate" hreflang="x-default" href="https://haowordtool.com/tools/unit-converter.html">
<!--
<link rel="alternate" hreflang="de" href="https://haowordtool.com/de/tools/einheitenrechner.html">
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tools.css">
</head>
<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header id="header">
  <div class="wrap">
    <nav class="nav">
      <a href="index.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
        Haowordtool Tools
      </a>
      <div class="nav-right">
        <div class="lang-switch" aria-label="Language">
          <a href="/tools/unit-converter.html" class="active" hreflang="en">EN</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap tool-page">
    <a href="index.html" class="back">← Back to all tools</a>
    <h1 style="margin-top:16px">Unit Converter</h1>
    <p class="lead">Convert length, weight, and temperature between common units. Runs entirely in your browser.</p>

    <div class="card" style="max-width:520px">
      <div style="margin-bottom:16px">
        <label for="cat">Category</label>
        <select id="cat">
          <option value="length">Length</option>
          <option value="weight">Weight</option>
          <option value="temp">Temperature</option>
        </select>
      </div>
      <div style="margin-bottom:16px">
        <label for="v">Value</label>
        <input type="number" id="v" value="1" step="any">
      </div>
      <div class="grid2">
        <div>
          <label for="from">From</label>
          <select id="from"></select>
        </div>
        <div>
          <label for="to">To</label>
          <select id="to"></select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="go">Convert</button>
      </div>
      <div class="result" id="out" style="display:none">
        <div class="result-label">Result</div>
        <div class="result-value" id="res"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <span>© 2026 Haowordtool Tools · Free forever</span>
      <div class="foot-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </div>
</footer>

<script>
const units = {
  length: {m:1, km:1000, cm:.01, mm:.001, mi:1609.344, yd:.9144, ft:.3048, in:.0254},
  weight: {kg:1, g:.001, mg:1e-6, t:1000, lb:.45359237, oz:.028349523},
  temp: {c:1, f:1, k:1}
};
const labels = {
  length:{m:"Meters (m)",km:"Kilometers (km)",cm:"Centimeters (cm)",mm:"Millimeters (mm)",mi:"Miles (mi)",yd:"Yards (yd)",ft:"Feet (ft)",in:"Inches (in)"},
  weight:{kg:"Kilograms (kg)",g:"Grams (g)",mg:"Milligrams (mg)",t:"Metric tons (t)",lb:"Pounds (lb)",oz:"Ounces (oz)"},
  temp:{c:"Celsius (°C)",f:"Fahrenheit (°F)",k:"Kelvin (K)"}
};

const cat = document.getElementById("cat");
const from = document.getElementById("from");
const to = document.getElementById("to");

function fill(){
  from.innerHTML = ""; to.innerHTML = "";
  Object.keys(units[cat.value]).forEach(k => {
    from.innerHTML += `<option value="${k}">${labels[cat.value][k]}</option>`;
    to.innerHTML += `<option value="${k}">${labels[cat.value][k]}</option>`;
  });
  from.selectedIndex = 0;
  to.selectedIndex = 1;
}
cat.onchange = fill;
fill();

document.getElementById("go").onclick = () => {
  const v = parseFloat(document.getElementById("v").value) || 0;
  let res;
  if (cat.value === "temp") {
    const c = from.value === "c" ? v : from.value === "f" ? (v - 32) * 5/9 : v - 273.15;
    res = to.value === "c" ? c : to.value === "f" ? c * 9/5 + 32 : c + 273.15;
  } else {
    res = v * units[cat.value][from.value] / units[cat.value][to.value];
  }
  document.getElementById("res").textContent = res.toFixed(6).replace(/\.?0+$/, "") + " " + labels[cat.value][to.value].match(/\((.+)\)/)[1];
  document.getElementById("out").style.display = "block";
};

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
</body>
</html>
