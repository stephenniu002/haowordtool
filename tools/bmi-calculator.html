<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator — Body Mass Index</title>
<meta name="description" content="Free BMI calculator. Enter your height and weight to get your body mass index and healthy weight range.">
<link rel="canonical" href="https://haowordtool.com/tools/bmi-calculator.html">
<link rel="alternate" hreflang="en" href="https://haowordtool.com/tools/bmi-calculator.html">
<link rel="alternate" hreflang="x-default" href="https://haowordtool.com/tools/bmi-calculator.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tools.css">
</head>
<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<header id="header"><div class="wrap"><nav class="nav">
  <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>Haowordtool Tools</a>
  <div class="nav-right"><div class="lang-switch"><a href="/tools/bmi-calculator.html" class="active" hreflang="en">EN</a></div></div>
</nav></div></header>

<main><div class="wrap tool-page">
  <a href="index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">BMI Calculator</h1>
  <p class="lead">Calculate your body mass index from height and weight.</p>

  <div class="card" style="max-width:520px">
    <div class="grid2">
      <div><label for="h">Height (cm)</label><input type="number" id="h" value="170" min="50" max="250"></div>
      <div><label for="w">Weight (kg)</label><input type="number" id="w" value="65" min="10" max="400"></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary btn-block" id="go">Calculate BMI</button></div>

    <div class="result" id="out" style="display:none">
      <div class="result-label">Your BMI</div>
      <div class="result-value" id="val"></div>
      <div class="result-note" id="note"></div>
    </div>
  </div>
</div>
<div class="related-tools">
  <h2 id="relatedTitle">Related Tools</h2>
  <div class="related-grid" id="relatedGrid"></div>
</div>
</main>

<footer><div class="wrap"><div class="foot">
  <span>© 2026 Haowordtool Tools · Free forever</span>
  <div class="foot-links"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a></div>
</div></div></footer>

<script>
document.getElementById("go").onclick = () => {
  const h = parseFloat(document.getElementById("h").value) / 100;
  const w = parseFloat(document.getElementById("w").value);
  if (!h || !w) return;
  const bmi = w / (h * h);
  let note;
  if (bmi < 18.5) note = "Underweight (below 18.5)";
  else if (bmi < 25) note = "Normal weight (18.5 – 24.9)";
  else if (bmi < 30) note = "Overweight (25 – 29.9)";
  else note = "Obese (30 and above)";
  document.getElementById("val").textContent = bmi.toFixed(1);
  document.getElementById("note").textContent = note;
  document.getElementById("out").style.display = "block";
};
document.getElementById("go").click();

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>

<script type="application/json" id="relatedData">["age-calculator","word-counter","timer"]</script>
<script src="/assets/related-tools.js" defer></script>
</body>
</html>
