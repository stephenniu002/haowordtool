<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<header id="header"><div class="wrap"><nav class="nav">
  <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>Haowordtool Tools</a>
  <div class="nav-right"><div class="lang-switch"><a href="/tools/word-counter.html" class="active" hreflang="en">EN</a></div></div>
</nav></div></header>

<main><div class="wrap tool-page">
  <a href="index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">Word Counter</h1>
  <p class="lead">Paste or type your text. Stats update as you type, entirely in your browser.</p>

  <div class="card">
    <label for="text">Your text</label>
    <textarea id="text" placeholder="Start typing or paste text here…" style="min-height:220px"></textarea>
    <div class="grid4" style="margin-top:18px">
      <div style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02)">
        <div id="chars" style="font-family:var(--mono);font-size:24px;font-weight:700">0</div>
        <div style="font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px">Characters</div>
      </div>
      <div style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02)">
        <div id="words" style="font-family:var(--mono);font-size:24px;font-weight:700">0</div>
        <div style="font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px">Words</div>
      </div>
      <div style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02)">
        <div id="lines" style="font-family:var(--mono);font-size:24px;font-weight:700">0</div>
        <div style="font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px">Lines</div>
      </div>
      <div style="text-align:center;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02)">
        <div id="time" style="font-family:var(--mono);font-size:24px;font-weight:700">0</div>
        <div style="font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px">Min read</div>
      </div>
    </div>
  </div>
</div>
<div class="related-tools">
  <h2 id="relatedTitle">Related Tools</h2>
  <div class="related-grid" id="relatedGrid"></div>
</div>
</main>

<footer><div class="wrap"><div class="foot">
  <span>© 2026 Haowordtool Tools · Free forever</span>
  <div class="foot-links"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/contact.html">Contact</a></div>
</div></div></footer>

<script>
const t = document.getElementById("text");
function upd(){
  const v = t.value;
  document.getElementById("chars").textContent = v.length;
  document.getElementById("words").textContent = v.trim() ? v.trim().split(/\s+/).length : 0;
  document.getElementById("lines").textContent = v ? v.split(/\n/).length : 0;
  document.getElementById("time").textContent = Math.max(0, Math.ceil((v.trim() ? v.trim().split(/\s+/).length : 0) / 200));
}
t.oninput = upd; upd();
const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>

<script type="application/json" id="relatedData">["calculator","bmi-calculator","age-calculator"]</script>
<script src="/assets/related-tools.js" defer></script>
