<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Calculator — Monthly Payment & Interest</title>
<meta name="description" content="Free mortgage calculator. Estimate your monthly payment, total payment, and total interest based on loan amount, term, and rate.">
<link rel="canonical" href="https://haowordtool.com/tools/mortgage-calculator.html">

<link rel="alternate" hreflang="en" href="https://haowordtool.com/tools/mortgage-calculator.html">
<link rel="alternate" hreflang="x-default" href="https://haowordtool.com/tools/mortgage-calculator.html">
<!--
<link rel="alternate" hreflang="de" href="https://haowordtool.com/de/tools/hypothekenrechner.html">
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tools.css">
</head>
<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header id="header">
  <div class="wrap">
    <nav class="nav">
      <a href="index.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
        Haowordtool Tools
      </a>
      <div class="nav-right">
        <div class="lang-switch" aria-label="Language">
          <a href="/tools/mortgage-calculator.html" class="active" hreflang="en">EN</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap tool-page">
    <a href="index.html" class="back">← Back to all tools</a>
    <h1 style="margin-top:16px">Mortgage Calculator</h1>
    <p class="lead">Estimate monthly payment, total payment, and total interest. Uses the standard amortized formula (equal monthly payments).</p>

    <div class="card" style="max-width:520px">
      <div style="margin-bottom:16px">
        <label for="p">Loan amount</label>
        <input type="number" id="p" value="300000" min="0">
      </div>
      <div class="grid2">
        <div>
          <label for="y">Term (years)</label>
          <input type="number" id="y" value="30" min="1">
        </div>
        <div>
          <label for="r">Annual rate (%)</label>
          <input type="number" id="r" value="6.5" step="0.01" min="0">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="go">Calculate</button>
      </div>
      <div class="result" id="out" style="display:none">
        <div class="result-label">Monthly payment</div>
        <div class="result-value" id="m"></div>
        <div class="result-note" id="note"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <span>© 2026 Haowordtool Tools · Free forever</span>
      <div class="foot-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </div>
</footer>

<script>
function fmt(n){
  return n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function calc(){
  const P = parseFloat(document.getElementById("p").value) || 0;
  const n = (parseFloat(document.getElementById("y").value) || 0) * 12;
  const r = (parseFloat(document.getElementById("r").value) || 0) / 100 / 12;
  if (!P || !n) return;
  const m = r ? P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : P / n;
  const total = m * n;
  const interest = total - P;
  document.getElementById("m").textContent = "$" + fmt(m);
  document.getElementById("note").textContent = `Total payment $${fmt(total)} · Total interest $${fmt(interest)}`;
  document.getElementById("out").style.display = "block";
}
document.getElementById("go").onclick = calc;
calc();

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
</body>
</html>
