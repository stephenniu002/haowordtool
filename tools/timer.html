<main><div class="wrap tool-page">

  <h1 style="margin-top:16px">Timer & Stopwatch</h1>
  <p class="lead">A precise stopwatch for any task. Click start, click again to pause.</p>

  <div class="card" style="max-width:520px;text-align:center">
    <div id="disp" style="font-family:var(--mono);font-size:clamp(40px,7vw,64px);font-weight:700;letter-spacing:-.03em;margin:24px 0">00:00.00</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">

<script>
let ms = 0, t0 = 0, running = false, raf = null;
const disp = document.getElementById("disp");
const start = document.getElementById("start");
const reset = document.getElementById("reset");

function fmt(v){
  const m = Math.floor(v / 60000);
  const s = Math.floor((v % 60000) / 1000);
  const cs = Math.floor((v % 1000) / 10);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0");
}
function loop(){
  disp.textContent = fmt(ms + (Date.now() - t0));
  raf = requestAnimationFrame(loop);
}
start.onclick = () => {
  if (!running) {
    running = true;
    t0 = Date.now();
    start.textContent = "Pause";
    loop();
  } else {
    running = false;
    ms += Date.now() - t0;
    cancelAnimationFrame(raf);
    start.textContent = "Resume";
  }
};
reset.onclick = () => {
  ms = 0;
  running = false;
  cancelAnimationFrame(raf);
  disp.textContent = "00:00.00";
  start.textContent = "Start";
};

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
