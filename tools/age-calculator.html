<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator — Exact Age in Years, Months, Days</title>
<meta name="description" content="Free age calculator. Get your exact age in years, months, and days, plus a countdown to your next birthday.">
<link rel="canonical" href="https://haowordtool.com/tools/age-calculator.html">
<link rel="alternate" hreflang="en" href="https://haowordtool.com/tools/age-calculator.html">
<link rel="alternate" hreflang="x-default" href="https://haowordtool.com/tools/age-calculator.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tools.css">
</head>
<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<header id="header"><div class="wrap"><nav class="nav">
  <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>Haowordtool Tools</a>
  <div class="nav-right"><div class="lang-switch"><a href="/tools/age-calculator.html" class="active" hreflang="en">EN</a></div></div>
</nav></div></header>

<main><div class="wrap tool-page">
  <a href="index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">Age Calculator</h1>
  <p class="lead">Find your exact age in years, months, and days. Also shows how long until your next birthday.</p>

  <div class="card" style="max-width:520px">
    <label for="dob">Date of birth</label>
    <input type="date" id="dob" value="2000-01-01">
    <div class="btn-row"><button class="btn btn-primary btn-block" id="go">Calculate age</button></div>

    <div class="result" id="out" style="display:none">
      <div class="result-label">Your age</div>
      <div class="result-value" id="val"></div>
      <div class="result-note" id="note"></div>
    </div>
  </div>
</div></main>

<footer><div class="wrap"><div class="foot">
  <span>© 2026 Haowordtool Tools · Free forever</span>
  <div class="foot-links"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a></div>
</div></div></footer>

<script>
document.getElementById("go").onclick = () => {
  const dob = new Date(document.getElementById("dob").value);
  if (isNaN(dob)) return;
  const now = new Date();
  let y = now.getFullYear() - dob.getFullYear();
  let m = now.getMonth() - dob.getMonth();
  let d = now.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

  document.getElementById("val").textContent = `${y} years, ${m} months, ${d} days`;

  const next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
  if (next < now) next.setFullYear(next.getFullYear() + 1);
  const days = Math.ceil((next - now) / 86400000);
  document.getElementById("note").textContent = days === 0 ? "Happy birthday!" : `${days} days until next birthday`;
  document.getElementById("out").style.display = "block";
};
document.getElementById("go").click();

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
</body>
</html>
