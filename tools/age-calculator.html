<main><div class="wrap tool-page">
  <a href="index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">Age Calculator</h1>
  <p class="lead">Find your exact age in years, months, and days. Also shows how long until your next birthday.</p>

  <div class="card" style="max-width:520px">
    <label for="dob">Date of birth</label>
    <input type="date" id="dob" value="2000-01-01">
    <div class="btn-row"><button class="btn btn-primary btn-block" id="go">Calculate age</button></div>

    <div class="result" id="out" style="display:none">
      <div class="result-label">Your age</div>

      <div class="result-note" id="note"></div>

<script>
document.getElementById("go").onclick = () => {
  const dob = new Date(document.getElementById("dob").value);
  if (isNaN(dob)) return;
  const now = new Date();
  let y = now.getFullYear() - dob.getFullYear();
  let m = now.getMonth() - dob.getMonth();
  let d = now.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

  document.getElementById("val").textContent = `${y} years, ${m} months, ${d} days`;

  const next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
  if (next < now) next.setFullYear(next.getFullYear() + 1);
  const days = Math.ceil((next - now) / 86400000);
  document.getElementById("note").textContent = days === 0 ? "Happy birthday!" : `${days} days until next birthday`;
  document.getElementById("out").style.display = "block";
};
document.getElementById("go").click();

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
