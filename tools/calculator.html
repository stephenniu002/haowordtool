<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header id="header">
  <div class="wrap">
    <nav class="nav">
      <a href="index.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
        Haowordtool Tools
      </a>
      <div class="nav-right">
        <div class="lang-switch" aria-label="Language">
          <a href="/tools/calculator.html" class="active" hreflang="en">EN</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap tool-page">
    <a href="index.html" class="back">← Back to all tools</a>
    <h1 style="margin-top:16px">Calculator</h1>
    <p class="lead">Basic four-function calculator. Use the buttons or your keyboard.</p>

    <div class="card" style="max-width:420px">
      <div class="calc-display">
        <div class="expr" id="expr">&nbsp;</div>
        <div class="val" id="val">0</div>
      </div>
      <div class="calc-grid">
        <button class="calc-btn op" data-k="C">C</button>
        <button class="calc-btn op" data-k="±">±</button>
        <button class="calc-btn op" data-k="%">%</button>
        <button class="calc-btn op" data-k="/">÷</button>
        <button class="calc-btn" data-k="7">7</button>
        <button class="calc-btn" data-k="8">8</button>
        <button class="calc-btn" data-k="9">9</button>
        <button class="calc-btn op" data-k="*">×</button>
        <button class="calc-btn" data-k="4">4</button>
        <button class="calc-btn" data-k="5">5</button>
        <button class="calc-btn" data-k="6">6</button>
        <button class="calc-btn op" data-k="-">−</button>
        <button class="calc-btn" data-k="1">1</button>
        <button class="calc-btn" data-k="2">2</button>
        <button class="calc-btn" data-k="3">3</button>
        <button class="calc-btn op" data-k="+">+</button>
        <button class="calc-btn wide" data-k="0">0</button>
        <button class="calc-btn" data-k=".">.</button>
        <button class="calc-btn eq" data-k="=">=</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <span>© 2026 Haowordtool Tools · Free forever</span>
      <div class="foot-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </div>
</footer>

<script>
let cur = "0", prev = null, op = null, reset = false;
const val = document.getElementById("val");
const expr = document.getElementById("expr");

function upd(){
  val.textContent = cur;
  expr.textContent = prev !== null ? prev + " " + (op || "") : " ";
}
function calc(a, b, o){
  return o === "+" ? a + b : o === "-" ? a - b : o === "*" ? a * b : o === "/" ? a / b : 0;
}
function press(k){
  if (k === "C") { cur = "0"; prev = null; op = null; reset = false; }
  else if (k === "±") cur = cur.startsWith("-") ? cur.slice(1) : "-" + cur;
  else if (k === "%") cur = String(parseFloat(cur) / 100);
  else if (["+", "-", "*", "/"].includes(k)) {
    if (op && !reset) { cur = String(calc(parseFloat(prev), parseFloat(cur), op)); }
    prev = cur; op = k; reset = true;
  } else if (k === "=") {
    if (op) { cur = String(calc(parseFloat(prev), parseFloat(cur), op)); prev = null; op = null; reset = true; }
  } else if (k === ".") {
    if (!cur.includes(".")) cur += ".";
  } else {
    if (reset || cur === "0") { cur = k; reset = false; }
    else cur += k;
  }
  upd();
}
document.querySelectorAll(".calc-btn").forEach(b => b.onclick = () => press(b.dataset.k));

document.addEventListener("keydown", e => {
  const k = e.key;
  if (/[0-9]/.test(k) || ["+","-","*","/","."].includes(k)) { press(k); e.preventDefault(); }
  else if (k === "Enter" || k === "=") { press("="); e.preventDefault(); }
  else if (k === "Backspace") {
    cur = cur.length > 1 ? cur.slice(0, -1) : "0"; upd(); e.preventDefault();
  } else if (k === "Escape") { press("C"); }
});
upd();

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
</body>
</html>
