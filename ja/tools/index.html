<link rel="alternate" hreflang="ar" href="https://haowordtool.com/ar/index.html">
<link rel="alternate" hreflang="ru" href="https://haowordtool.com/ru/index.html">

<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header id="header"><div class="wrap"><nav class="nav">
  <a href="../index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>Haowordtool Tools</a>
  <div class="nav-right"><div class="lang-switch" aria-label="言語">
    <a href="/tools/" hreflang="en">EN</a>
    <a href="/ja/tools/index.html" class="active" hreflang="ja">JA</a>
    <a href="/de/index.html" hreflang="de">DE</a>
    <a href="/es/index.html" hreflang="es">ES</a>
    <a href="/ar/index.html" hreflang="ar">AR</a>
    <a href="/ru/index.html" hreflang="ru">RU</a>
  </div></div>
</nav></div></header>

<section class="hero"><div class="wrap">
  <div class="badge"><i></i> 14 Tools · 無料 · 登録不要</div>
  <h1>無料オンラインツール<br><span class="grad">すぐ使える</span></h1>
  <p class="sub">換算、画像、ネットワーク、暮らし——すべてブラウザで動作。アップロードも登録も不要。</p>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" id="search" placeholder="ツールを検索（例：通貨、BMI…）">
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">すべて</button>
    <button class="tab" data-cat="convert">換算</button>
    <button class="tab" data-cat="image">画像</button>
    <button class="tab" data-cat="network">ネットワーク</button>
    <button class="tab" data-cat="life">暮らし</button>
  </div>
</div></section>

<section class="tools-section"><div class="wrap">
  <div id="container"></div>
  <div id="empty" style="display:none;text-align:center;padding:60px 20px;color:var(--muted-2)"><h3 style="font-size:16px;color:var(--muted);margin-bottom:6px">ツールが見つかりません</h3><p>別のキーワードで検索してください</p></div>
</div></section>

<footer><div class="wrap"><div class="foot"><span>© 2026 Haowordtool Tools · すべて無料、保存されません</span>
<div class="foot-links"><a href="#">プライバシー</a><a href="#">利用規約</a><a href="#">お問い合わせ</a></div>
</div></div></footer>

<script>
const tools=[
  {cat:"convert",catName:"換算",name:"通貨換算",desc:"30以上の通貨を換算",icon:'<circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9h-4.5a2.5 2.5 0 0 0 0 5h3a2.5 2.5 0 0 1 0 5H9"/>',link:"tools/currency-converter.html"},
  {cat:"convert",catName:"換算",name:"電卓",desc:"四則演算、キーボード対応",icon:'<rect x="4" y="2" width="16" height="20" rx="2"/>',link:"tools/calculator.html"},
  {cat:"convert",catName:"換算",name:"住宅ローン計算",desc:"月々の返済額と総利息",icon:'<path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',link:"tools/mortgage-calculator.html"},
  {cat:"convert",catName:"換算",name:"単位換算",desc:"長さ・重さ・温度",icon:'<path d="M2 12h20"/>',link:"tools/unit-converter.html"},
  {cat:"image",catName:"画像",name:"画像圧縮",desc:"JPG / PNG をブラウザで",icon:'<rect x="3" y="3" width="18" height="18" rx="3"/>',link:"tools/image-compressor.html"},
  {cat:"image",catName:"画像",name:"画像リサイズ",desc:"サイズ指定、アスペクト比維持",icon:'<rect x="3" y="3" width="18" height="18" rx="3"/>',link:"tools/resize-image.html"},
  {cat:"network",catName:"ネットワーク",name:"IP アドレス確認",desc:"グローバル IP、地域、プロバイダ",icon:'<circle cx="12" cy="12" r="10"/>',link:"tools/what-is-my-ip.html"},
  {cat:"network",catName:"ネットワーク",name:"パスワード生成",desc:"長さ指定、ローカル生成",icon:'<rect x="3" y="11" width="18" height="11" rx="2"/>',link:"tools/password-generator.html"},
  {cat:"life",catName:"暮らし",name:"BMI 計算",desc:"身長・体重から BMI を計算",icon:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67"/>',link:"tools/bmi-calculator.html"},
  {cat:"life",catName:"暮らし",name:"年齢計算",desc:"正確な年齢とカウントダウン",icon:'<rect x="3" y="4" width="18" height="18" rx="2"/>',link:"tools/age-calculator.html"},
  {cat:"life",catName:"暮らし",name:"文字数カウント",desc:"文字数、単語数、読了時間",icon:'<path d="M4 7h16M4 12h10M4 17h7"/>',link:"tools/word-counter.html"},
  {cat:"life",catName:"暮らし",name:"QR コード生成",desc:"URL やテキストを QR コードに",icon:'<rect x="3" y="3" width="7" height="7" rx="1"/>',link:"tools/qr-code-generator.html"},
  {cat:"life",catName:"暮らし",name:"タイマー",desc:"カウントダウンとストップウォッチ",icon:'<circle cx="12" cy="13" r="8"/>',link:"tools/timer.html"},
  {cat:"life",catName:"暮らし",name:"世界時計",desc:"世界の主要都市の時刻",icon:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',link:"tools/world-clock.html"}
];
let activeCat="all";
function render(){
  const c=document.getElementById("container"),e=document.getElementById("empty");
  const kw=(document.getElementById("search").value||"").trim().toLowerCase();
  let list=tools;
  if(activeCat!=="all")list=list.filter(t=>t.cat===activeCat);
  if(kw)list=list.filter(t=>t.name.toLowerCase().includes(kw)||t.desc.toLowerCase().includes(kw)||t.catName.toLowerCase().includes(kw));
  if(!list.length){c.innerHTML="";e.style.display="block";return}
  e.style.display="none";
  const g={};
  list.forEach(t=>{if(!g[t.cat])g[t.cat]={name:t.catName,items:[]};g[t.cat].items.push(t)});
  c.innerHTML=Object.keys(g).map(k=>{const x=g[k];return `<div class="tool-group"><div class="group-head"><span class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/></svg></span><h2>${x.name}</h2><span class="g-sub">${x.items.length} Tools</span></div><div class="tools">${x.items.map(t=>`<a href="${t.link}" class="tool"><span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span><span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg></span><div class="tool-body"><h3>${t.name}</h3><p>${t.desc}</p></div></a>`).join("")}</div></div>`}).join("");
}
document.querySelectorAll("#tabs .tab").forEach(tab=>{tab.onclick=()=>{document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.remove("active"));tab.classList.add("active");activeCat=tab.dataset.cat;render();}});
let st;document.getElementById("search").addEventListener("input",()=>{clearTimeout(st);st=setTimeout(render,150);});
const header=document.getElementById("header");addEventListener("scroll",()=>header.classList.toggle("scrolled",scrollY>12),{passive:true});
render();
</script>
</body>
</html>
