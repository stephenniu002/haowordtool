<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily plan · HTML learning example</title><meta name="description" content="A free daily-plan example for importing HTML, CSS and JavaScript, checking mobile layouts and exporting a ZIP."><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><span class="tag">START WITH ONE SMALL THING</span><h1>My daily plan</h1><p>Write down what matters. Finish one thing at a time.</p></header><section class="summary"><strong id="count">0 / 3</strong><span>completed today</span></section><form id="task-form"><label for="task-input">Add a task</label><div class="entry"><input id="task-input" maxlength="60" required placeholder="For example: read for 20 minutes"><button>Add</button></div></form><ul id="tasks"><li><label><input type="checkbox"><span>Read for 20 minutes</span></label></li><li><label><input type="checkbox"><span>Go outside for a walk</span></label></li><li><label><input type="checkbox"><span>Finish one small goal</span></label></li></ul><p class="note" role="status" id="note">Learning example: tasks stay in this page only and reset on reload.</p></main><script src="app.js"></script></body></html>
