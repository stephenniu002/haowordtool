<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日计划 · 教程示例</title><meta name="description" content="用于学习 HTML、CSS 和 JavaScript 导入、手机预览与 ZIP 导出的免费示例。"><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><span class="tag">今天，从一件小事开始</span><h1>我的每日计划</h1><p>把重要的事写下来，一件一件完成。</p></header><section class="summary"><strong id="count">0 / 3</strong><span>今日完成</span></section><form id="task-form"><label for="task-input">添加一件要做的事</label><div class="entry"><input id="task-input" maxlength="60" required placeholder="例如：读书 20 分钟"><button>添加</button></div></form><ul id="tasks"><li><label><input type="checkbox"><span>给今天留 20 分钟阅读</span></label></li><li><label><input type="checkbox"><span>出去散步，放松一下</span></label></li><li><label><input type="checkbox"><span>完成一个小目标</span></label></li></ul><p class="note" role="status" id="note">这是学习示例。任务只在当前页面保存，刷新后重置。</p></main><script src="app.js"></script></body></html>
