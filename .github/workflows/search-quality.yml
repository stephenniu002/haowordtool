name: Search quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/search-seo.test.mjs
      - run: node scripts/optimize-search.mjs --check
      - run: node scripts/validate-site.mjs
