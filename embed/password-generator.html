<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — Strong Random Passwords — Embeddable</title>
<!-- 嵌入页与原页同内容，一律 noindex，权重只归原页 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Embeddable Password Generator — Strong Random Passwords widget — runs entirely in the browser, no sign-up, no upload.">
<link rel="canonical" href="https://haowordtool.com/tools/password-generator.html">
<link rel="stylesheet" href="/assets/tools.css">

<style>
  /* 嵌入态：去掉页边距，压掉大标题，只留工具本体 */
  html,body{margin:0;padding:0;background:#0b0f14}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6edf3}
  .embed-wrap{padding:14px 14px 0}
  .embed-wrap h1{font-size:18px;margin:0 0 10px;line-height:1.3}
  .embed-wrap > p:first-of-type{font-size:13px;color:#8b9bb0;margin:0 0 14px}
  .embed-credit{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:#8b9bb0;background:#0b0f14}
  .embed-credit a{color:#4fd1c5;text-decoration:none;font-weight:600}
  .embed-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="embed-wrap">
<div class="wrap tool-page">
  <a href="/tools/index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">Password Generator</h1>
  <p class="lead">Generate strong random passwords locally. Nothing is sent over the network.</p>

  <div class="card" style="max-width:560px">
    <div style="font-family:var(--mono);font-size:18px;font-weight:600;padding:18px 20px;background:rgba(0,0,0,.3);border:1px solid var(--border-strong);border-radius:11px;word-break:break-all;line-height:1.5;color:var(--accent-3);margin-bottom:14px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span id="pw">…</span>
      <button class="btn btn-ghost" id="copy" style="padding:8px 14px;font-size:13px">Copy</button>
    </div>

    <div>
      <label>Length: <span id="lv">16</span></label>
      <input type="range" id="len" min="6" max="64" value="16">
    </div>

    <div class="grid2" style="margin-top:16px">
      <label class="check-row"><input type="checkbox" id="upper" checked> Uppercase</label>
      <label class="check-row"><input type="checkbox" id="lower" checked> Lowercase</label>
      <label class="check-row"><input type="checkbox" id="num" checked> Numbers</label>
      <label class="check-row"><input type="checkbox" id="sym" checked> Symbols</label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary btn-block" id="gen">Generate new password</button>
    </div>
  </div>
</div>

</div>

</div>
<div class="embed-credit">
  <span>Free, browser-based, no sign-up.</span>
  <a href="https://haowordtool.com/tools/password-generator.html" target="_blank" rel="noopener">Password Generator by HaoWordTool →</a>
</div>
<script>
const out = document.getElementById("pw");
const len = document.getElementById("len"), lv = document.getElementById("lv");
const up = document.getElementById("upper"), lo = document.getElementById("lower");
const nu = document.getElementById("num"), sy = document.getElementById("sym");

function gen(){
  let chars = "";
  if (up.checked) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if (lo.checked) chars += "abcdefghijklmnopqrstuvwxyz";
  if (nu.checked) chars += "0123456789";
  if (sy.checked) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";
  if (!chars) chars = "abcdefghijklmnopqrstuvwxyz";
  const n = parseInt(len.value);
  const arr = new Uint32Array(n);
  crypto.getRandomValues(arr);
  let p = "";
  for (let i = 0; i < n; i++) p += chars[arr[i] % chars.length];
  out.textContent = p;
}

len.oninput = () => { lv.textContent = len.value; gen(); };
[up, lo, nu, sy].forEach(c => c.onchange = gen);
document.getElementById("gen").onclick = gen;
document.getElementById("copy").onclick = () => {
  navigator.clipboard.writeText(out.textContent).then(() => {
    const b = document.getElementById("copy");
    b.textContent = "Copied ✓";
    setTimeout(() => b.textContent = "Copy", 1500);
  });
};

gen();
const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
<script type="application/json" id="relatedData">["what-is-my-ip","qr-code-generator","image-compressor"]</script>
</body>
</html>
