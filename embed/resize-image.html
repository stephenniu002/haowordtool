<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resize Image — Online Image Resizer — Embeddable</title>
<!-- 嵌入页与原页同内容，一律 noindex，权重只归原页 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Embeddable Resize Image — Online Image Resizer widget — runs entirely in the browser, no sign-up, no upload.">
<link rel="canonical" href="https://haowordtool.com/tools/resize-image.html">
<link rel="stylesheet" href="/assets/tools.css">

<style>
  /* 嵌入态：去掉页边距，压掉大标题，只留工具本体 */
  html,body{margin:0;padding:0;background:#0b0f14}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6edf3}
  .embed-wrap{padding:14px 14px 0}
  .embed-wrap h1{font-size:18px;margin:0 0 10px;line-height:1.3}
  .embed-wrap > p:first-of-type{font-size:13px;color:#8b9bb0;margin:0 0 14px}
  .embed-credit{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:#8b9bb0;background:#0b0f14}
  .embed-credit a{color:#4fd1c5;text-decoration:none;font-weight:600}
  .embed-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="embed-wrap">
<div class="wrap tool-page">
  <a href="/tools/index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">Resize Image</h1>
  <p class="lead">Change image dimensions. Everything runs locally, nothing is uploaded.</p>

  <div class="card" style="max-width:640px">
    <div id="area" style="border:2px dashed var(--border-strong);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;transition:.25s;background:rgba(255,255,255,.015)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px;color:var(--muted-2);margin:0 auto 12px;display:block"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M3 9h18"/></svg>
      <div style="font-size:14.5px;font-weight:600;margin-bottom:6px">Click to upload an image</div>
      <div style="font-size:12.5px;color:var(--muted-2)">JPG · PNG · WebP</div>
    </div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <img id="preview" style="display:none;max-width:100%;max-height:280px;border-radius:12px;margin-top:18px;border:1px solid var(--border)">

    <div class="grid2" style="margin-top:20px">
      <div><label for="w">Width</label><input type="number" id="w"></div>
      <div><label for="h">Height</label><input type="number" id="h"></div>
    </div>
    <label class="check-row" style="margin-top:12px;display:inline-flex">
      <input type="checkbox" id="ratio" checked> Keep aspect ratio
    </label>

    <div class="btn-row">
      <a id="dl" class="btn btn-primary" style="display:none" download="resized.png">Download resized</a>
    </div>
  </div>
</div>

</div>

</div>
<div class="embed-credit">
  <span>Free, browser-based, no sign-up.</span>
  <a href="https://haowordtool.com/tools/resize-image.html" target="_blank" rel="noopener">Resize Image by HaoWordTool →</a>
</div>
<script>
const area = document.getElementById("area"), file = document.getElementById("file");
const preview = document.getElementById("preview"), w = document.getElementById("w"), h = document.getElementById("h");
const ratio = document.getElementById("ratio"), dl = document.getElementById("dl");
let img = null, aspect = 1;

area.onclick = () => file.click();
file.onchange = () => {
  const f = file.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    img = new Image();
    img.onload = () => {
      preview.src = e.target.result;
      preview.style.display = "block";
      w.value = img.width;
      h.value = img.height;
      aspect = img.width / img.height;
      area.style.display = "none";
      dl.style.display = "inline-flex";
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
};

w.oninput = () => { if (ratio.checked && aspect) h.value = Math.round(w.value / aspect); };
h.oninput = () => { if (ratio.checked && aspect) w.value = Math.round(h.value * aspect); };

dl.onclick = e => {
  if (!img) return;
  const c = document.createElement("canvas");
  c.width = parseInt(w.value) || img.width;
  c.height = parseInt(h.value) || img.height;
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  c.toBlob(b => { dl.href = URL.createObjectURL(b); });
};

const header = (document.getElementById('header')||document.createElement('div'));
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
<script type="application/json" id="relatedData">["image-compressor","qr-code-generator","world-clock"]</script>
</body>
</html>
