<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Calculator — Monthly Payment & Interest — Embeddable</title>
<!-- 嵌入页与原页同内容，一律 noindex，权重只归原页 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Embeddable Mortgage Calculator — Monthly Payment & Interest widget — runs entirely in the browser, no sign-up, no upload.">
<link rel="canonical" href="https://haowordtool.com/tools/mortgage-calculator.html">
<link rel="stylesheet" href="/assets/tools.css">

<style>
  /* 嵌入态：去掉页边距，压掉大标题，只留工具本体 */
  html,body{margin:0;padding:0;background:#0b0f14}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6edf3}
  .embed-wrap{padding:14px 14px 0}
  .embed-wrap h1{font-size:18px;margin:0 0 10px;line-height:1.3}
  .embed-wrap > p:first-of-type{font-size:13px;color:#8b9bb0;margin:0 0 14px}
  .embed-credit{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:#8b9bb0;background:#0b0f14}
  .embed-credit a{color:#4fd1c5;text-decoration:none;font-weight:600}
  .embed-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="embed-wrap">

  <div class="wrap tool-page">
    <a href="/tools/index.html" class="back">← Back to all tools</a>
    <h1 style="margin-top:16px">Mortgage Calculator</h1>
    <p class="lead">Estimate monthly payment, total payment, and total interest. Uses the standard amortized formula (equal monthly payments).</p>

    <div class="card" style="max-width:520px">
      <div style="margin-bottom:16px">
        <label for="p">Loan amount</label>
        <input type="number" id="p" value="300000" min="0">
      </div>
      <div class="grid2">
        <div>
          <label for="y">Term (years)</label>
          <input type="number" id="y" value="30" min="1">
        </div>
        <div>
          <label for="r">Annual rate (%)</label>
          <input type="number" id="r" value="6.5" step="0.01" min="0">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="go">Calculate</button>
      </div>
      <div class="result" id="out" style="display:none">
        <div class="result-label">Monthly payment</div>
        <div class="result-value" id="m"></div>
        <div class="result-note" id="note"></div>
      </div>
    </div>
  </div>

</div>

</div>
<div class="embed-credit">
  <span>Free, browser-based, no sign-up.</span>
  <a href="https://haowordtool.com/tools/mortgage-calculator.html" target="_blank" rel="noopener">Mortgage Calculator by HaoWordTool →</a>
</div>
<script>
function fmt(n){
  return n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function calc(){
  const P = parseFloat(document.getElementById("p").value) || 0;
  const n = (parseFloat(document.getElementById("y").value) || 0) * 12;
  const r = (parseFloat(document.getElementById("r").value) || 0) / 100 / 12;
  if (!P || !n) return;
  const m = r ? P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : P / n;
  const total = m * n;
  const interest = total - P;
  document.getElementById("m").textContent = "$" + fmt(m);
  document.getElementById("note").textContent = `Total payment $${fmt(total)} · Total interest $${fmt(interest)}`;
  document.getElementById("out").style.display = "block";
}
document.getElementById("go").onclick = calc;
calc();

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
<script type="application/json" id="relatedData">["calculator","currency-converter","bmi-calculator"]</script>
</body>
</html>
