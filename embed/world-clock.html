<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock — Current Time Around the World — Embeddable</title>
<!-- 嵌入页与原页同内容，一律 noindex，权重只归原页 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Embeddable World Clock — Current Time Around the World widget — runs entirely in the browser, no sign-up, no upload.">
<link rel="canonical" href="https://haowordtool.com/tools/world-clock.html">
<link rel="stylesheet" href="/assets/tools.css">

<style>
  /* 嵌入态：去掉页边距，压掉大标题，只留工具本体 */
  html,body{margin:0;padding:0;background:#0b0f14}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6edf3}
  .embed-wrap{padding:14px 14px 0}
  .embed-wrap h1{font-size:18px;margin:0 0 10px;line-height:1.3}
  .embed-wrap > p:first-of-type{font-size:13px;color:#8b9bb0;margin:0 0 14px}
  .embed-credit{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:#8b9bb0;background:#0b0f14}
  .embed-credit a{color:#4fd1c5;text-decoration:none;font-weight:600}
  .embed-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="embed-wrap">
<div class="wrap tool-page">
  <a href="/tools/index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">World Clock</h1>
  <p class="lead">Current local time in major cities. Updates every second.</p>

  <div class="card">
    <div id="list" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px"></div>
  </div>
</div>

</div>

</div>
<div class="embed-credit">
  <span>Free, browser-based, no sign-up.</span>
  <a href="https://haowordtool.com/tools/world-clock.html" target="_blank" rel="noopener">World Clock by HaoWordTool →</a>
</div>
<script>
const cities = [
  {name:"New York", tz:"America/New_York"},
  {name:"Los Angeles", tz:"America/Los_Angeles"},
  {name:"London", tz:"Europe/London"},
  {name:"Paris", tz:"Europe/Paris"},
  {name:"Berlin", tz:"Europe/Berlin"},
  {name:"Tokyo", tz:"Asia/Tokyo"},
  {name:"Beijing", tz:"Asia/Shanghai"},
  {name:"Singapore", tz:"Asia/Singapore"},
  {name:"Sydney", tz:"Australia/Sydney"},
  {name:"Dubai", tz:"Asia/Dubai"},
  {name:"São Paulo", tz:"America/Sao_Paulo"},
  {name:"Mexico City", tz:"America/Mexico_City"}
];

function tick(){
  const list = document.getElementById("list");
  list.innerHTML = cities.map(c => {
    const now = new Date();
    const fmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: c.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
    }).format(now);
    const dateFmt = new Intl.DateTimeFormat("en-US", {
      timeZone: c.tz, weekday:"short", month:"short", day:"numeric"
    }).format(now);
    return `<div style="padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div>
        <div style="font-size:14.5px;font-weight:650">${c.name}</div>
        <div style="font-size:11.5px;color:var(--muted-2);margin-top:2px">${dateFmt}</div>
      </div>
      <div style="font-family:var(--mono);font-size:17px;font-weight:600;color:var(--accent-2)">${fmt}</div>
    </div>`;
  }).join("");
}
tick();
setInterval(tick, 1000);

const header = (document.getElementById('header')||document.createElement('div'));
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
<script type="application/json" id="relatedData">["timer","age-calculator","what-is-my-ip"]</script>
</body>
</html>
