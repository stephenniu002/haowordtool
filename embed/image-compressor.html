<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor — Compress JPG & PNG Online — Embeddable</title>
<!-- 嵌入页与原页同内容，一律 noindex，权重只归原页 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Embeddable Image Compressor — Compress JPG & PNG Online widget — runs entirely in the browser, no sign-up, no upload.">
<link rel="canonical" href="https://haowordtool.com/tools/image-compressor.html">
<link rel="stylesheet" href="/assets/tools.css">

<style>
  /* 嵌入态：去掉页边距，压掉大标题，只留工具本体 */
  html,body{margin:0;padding:0;background:#0b0f14}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6edf3}
  .embed-wrap{padding:14px 14px 0}
  .embed-wrap h1{font-size:18px;margin:0 0 10px;line-height:1.3}
  .embed-wrap > p:first-of-type{font-size:13px;color:#8b9bb0;margin:0 0 14px}
  .embed-credit{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:#8b9bb0;background:#0b0f14}
  .embed-credit a{color:#4fd1c5;text-decoration:none;font-weight:600}
  .embed-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="embed-wrap">
<div class="wrap tool-page">
  <a href="/tools/index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">Image Compressor</h1>
  <p class="lead">Compress JPG, PNG, or WebP. Everything runs locally in your browser — your images never leave your device.</p>

  <div class="card" style="max-width:640px">
    <div id="area" style="border:2px dashed var(--border-strong);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;transition:.25s;background:rgba(255,255,255,.015)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px;color:var(--muted-2);margin:0 auto 12px;display:block"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      <div style="font-size:14.5px;font-weight:600;margin-bottom:6px">Click to upload an image</div>
      <div style="font-size:12.5px;color:var(--muted-2)">JPG · PNG · WebP</div>
    </div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <img id="preview" style="display:none;max-width:100%;max-height:300px;border-radius:12px;margin-top:18px;border:1px solid var(--border)">

    <div style="margin-top:20px">
      <label>Quality: <span id="qv">70</span>%</label>
      <input type="range" id="q" min="10" max="100" value="70">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="go" style="display:none">Compress</button>
      <a id="dl" class="btn btn-ghost" style="display:none" download="compressed.jpg">Download</a>
    </div>

    <div class="result" id="out" style="display:none">
      <div class="result-label">Compressed size</div>
      <div class="result-value" id="info"></div>
    </div>
  </div>
</div>

</div>

</div>
<div class="embed-credit">
  <span>Free, browser-based, no sign-up.</span>
  <a href="https://haowordtool.com/tools/image-compressor.html" target="_blank" rel="noopener">Image Compressor by HaoWordTool →</a>
</div>
<script>
const area = document.getElementById("area"), file = document.getElementById("file");
const preview = document.getElementById("preview"), q = document.getElementById("q");
const qv = document.getElementById("qv"), go = document.getElementById("go");
const dl = document.getElementById("dl"), out = document.getElementById("out");
let img = null, origKB = 0;

area.onclick = () => file.click();
file.onchange = () => {
  const f = file.files[0]; if (!f) return;
  origKB = f.size / 1024;
  const r = new FileReader();
  r.onload = e => {
    img = new Image();
    img.onload = () => {
      preview.src = e.target.result;
      preview.style.display = "block";
      go.style.display = "inline-flex";
      area.style.display = "none";
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
};

q.oninput = () => qv.textContent = q.value;

go.onclick = () => {
  if (!img) return;
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0);
  c.toBlob(b => {
    dl.href = URL.createObjectURL(b);
    dl.style.display = "inline-flex";
    const newKB = b.size / 1024;
    const ratio = Math.round((1 - newKB / origKB) * 100);
    document.getElementById("info").textContent = origKB.toFixed(0) + " KB → " + newKB.toFixed(0) + " KB (−" + ratio + "%)";
    out.style.display = "block";
  }, "image/jpeg", q.value / 100);
};

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
<script type="application/json" id="relatedData">["resize-image","qr-code-generator","password-generator"]</script>
</body>
</html>
