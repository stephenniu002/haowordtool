<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator — Exact Age in Years, Months, Days — Embeddable</title>
<!-- 嵌入页与原页同内容，一律 noindex，权重只归原页 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Embeddable Age Calculator — Exact Age in Years, Months, Days widget — runs entirely in the browser, no sign-up, no upload.">
<link rel="canonical" href="https://haowordtool.com/tools/age-calculator.html">
<link rel="stylesheet" href="/assets/tools.css">

<style>
  /* 嵌入态：去掉页边距，压掉大标题，只留工具本体 */
  html,body{margin:0;padding:0;background:#0b0f14}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6edf3}
  .embed-wrap{padding:14px 14px 0}
  .embed-wrap h1{font-size:18px;margin:0 0 10px;line-height:1.3}
  .embed-wrap > p:first-of-type{font-size:13px;color:#8b9bb0;margin:0 0 14px}
  .embed-credit{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:#8b9bb0;background:#0b0f14}
  .embed-credit a{color:#4fd1c5;text-decoration:none;font-weight:600}
  .embed-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="embed-wrap">
<div class="wrap tool-page">
  <a href="/tools/index.html" class="back">← Back to all tools</a>
  <h1 style="margin-top:16px">Age Calculator</h1>
  <p class="lead">Find your exact age in years, months, and days. Also shows how long until your next birthday.</p>

  <div class="card" style="max-width:520px">
    <label for="dob">Date of birth</label>
    <input type="date" id="dob" value="2000-01-01">
    <div class="btn-row"><button class="btn btn-primary btn-block" id="go">Calculate age</button></div>

    <div class="result" id="out" style="display:none">
      <div class="result-label">Your age</div>
      <div class="result-value" id="val"></div>
      <div class="result-note" id="note"></div>
    </div>
  </div>
</div>

</div>

</div>
<div class="embed-credit">
  <span>Free, browser-based, no sign-up.</span>
  <a href="https://haowordtool.com/tools/age-calculator.html" target="_blank" rel="noopener">Age Calculator by HaoWordTool →</a>
</div>
<script>
document.getElementById("go").onclick = () => {
  const dob = new Date(document.getElementById("dob").value);
  if (isNaN(dob)) return;
  const now = new Date();
  let y = now.getFullYear() - dob.getFullYear();
  let m = now.getMonth() - dob.getMonth();
  let d = now.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

  document.getElementById("val").textContent = `${y} years, ${m} months, ${d} days`;

  const next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
  if (next < now) next.setFullYear(next.getFullYear() + 1);
  const days = Math.ceil((next - now) / 86400000);
  document.getElementById("note").textContent = days === 0 ? "Happy birthday!" : `${days} days until next birthday`;
  document.getElementById("out").style.display = "block";
};
document.getElementById("go").click();

const header = (document.getElementById('header')||document.createElement('div'));
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
<script type="application/json" id="relatedData">["bmi-calculator","world-clock","timer"]</script>
</body>
</html>
