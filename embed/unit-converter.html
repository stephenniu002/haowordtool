<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — Length, Weight, Temperature — Embeddable</title>
<!-- 嵌入页与原页同内容，一律 noindex，权重只归原页 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Embeddable Unit Converter — Length, Weight, Temperature widget — runs entirely in the browser, no sign-up, no upload.">
<link rel="canonical" href="https://haowordtool.com/tools/unit-converter.html">
<link rel="stylesheet" href="/assets/tools.css">

<style>
  /* 嵌入态：去掉页边距，压掉大标题，只留工具本体 */
  html,body{margin:0;padding:0;background:#0b0f14}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6edf3}
  .embed-wrap{padding:14px 14px 0}
  .embed-wrap h1{font-size:18px;margin:0 0 10px;line-height:1.3}
  .embed-wrap > p:first-of-type{font-size:13px;color:#8b9bb0;margin:0 0 14px}
  .embed-credit{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    font-size:12px;color:#8b9bb0;background:#0b0f14}
  .embed-credit a{color:#4fd1c5;text-decoration:none;font-weight:600}
  .embed-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="embed-wrap">

  <div class="wrap tool-page">
    <a href="/tools/index.html" class="back">← Back to all tools</a>
    <h1 style="margin-top:16px">Unit Converter</h1>
    <p class="lead">Convert length, weight, and temperature between common units. Runs entirely in your browser.</p>

    <div class="card" style="max-width:520px">
      <div style="margin-bottom:16px">
        <label for="cat">Category</label>
        <select id="cat">
          <option value="length">Length</option>
          <option value="weight">Weight</option>
          <option value="temp">Temperature</option>
        </select>
      </div>
      <div style="margin-bottom:16px">
        <label for="v">Value</label>
        <input type="number" id="v" value="1" step="any">
      </div>
      <div class="grid2">
        <div>
          <label for="from">From</label>
          <select id="from"></select>
        </div>
        <div>
          <label for="to">To</label>
          <select id="to"></select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="go">Convert</button>
      </div>
      <div class="result" id="out" style="display:none">
        <div class="result-label">Result</div>
        <div class="result-value" id="res"></div>
      </div>
    </div>
  </div>

</div>

</div>
<div class="embed-credit">
  <span>Free, browser-based, no sign-up.</span>
  <a href="https://haowordtool.com/tools/unit-converter.html" target="_blank" rel="noopener">Unit Converter by HaoWordTool →</a>
</div>
<script>
const units = {
  length: {m:1, km:1000, cm:.01, mm:.001, mi:1609.344, yd:.9144, ft:.3048, in:.0254},
  weight: {kg:1, g:.001, mg:1e-6, t:1000, lb:.45359237, oz:.028349523},
  temp: {c:1, f:1, k:1}
};
const labels = {
  length:{m:"Meters (m)",km:"Kilometers (km)",cm:"Centimeters (cm)",mm:"Millimeters (mm)",mi:"Miles (mi)",yd:"Yards (yd)",ft:"Feet (ft)",in:"Inches (in)"},
  weight:{kg:"Kilograms (kg)",g:"Grams (g)",mg:"Milligrams (mg)",t:"Metric tons (t)",lb:"Pounds (lb)",oz:"Ounces (oz)"},
  temp:{c:"Celsius (°C)",f:"Fahrenheit (°F)",k:"Kelvin (K)"}
};

const cat = document.getElementById("cat");
const from = document.getElementById("from");
const to = document.getElementById("to");

function fill(){
  from.innerHTML = ""; to.innerHTML = "";
  Object.keys(units[cat.value]).forEach(k => {
    from.innerHTML += `<option value="${k}">${labels[cat.value][k]}</option>`;
    to.innerHTML += `<option value="${k}">${labels[cat.value][k]}</option>`;
  });
  from.selectedIndex = 0;
  to.selectedIndex = 1;
}
cat.onchange = fill;
fill();

document.getElementById("go").onclick = () => {
  const v = parseFloat(document.getElementById("v").value) || 0;
  let res;
  if (cat.value === "temp") {
    const c = from.value === "c" ? v : from.value === "f" ? (v - 32) * 5/9 : v - 273.15;
    res = to.value === "c" ? c : to.value === "f" ? c * 9/5 + 32 : c + 273.15;
  } else {
    res = v * units[cat.value][from.value] / units[cat.value][to.value];
  }
  document.getElementById("res").textContent = res.toFixed(6).replace(/\.?0+$/, "") + " " + labels[cat.value][to.value].match(/\((.+)\)/)[1];
  document.getElementById("out").style.display = "block";
};

const header = document.getElementById("header");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 12), {passive:true});
</script>
<script type="application/json" id="relatedData">["currency-converter","calculator","word-counter"]</script>
</body>
</html>
